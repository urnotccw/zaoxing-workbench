<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>造形 · 游戏美术工作台</title><link rel="stylesheet" href="style.css"></head><body>
<!-- THESIS: Five visible production stages, one reusable context. OWN-WORLD: Inherited graphite art workspace, parchment text and brass primary controls. FORM: A pan/zoom canvas with five preconnected content-specific work areas, contextual inspector, folded batch results. Operate mode. Image generation is deliberately unconnected; examples and human decisions are labelled. -->
<header id="header"></header><nav id="steps" aria-label="角色工作区"></nav><div id="save-warning" role="alert" hidden>未能保存到浏览器，请导出项目备份。<button data-action="export">导出</button></div>
<main id="viewport" aria-label="工作流画布"><div id="world"><svg id="connections" aria-hidden="true"></svg><div id="nodes"></div></div><div class="canvas-help">拖动空白处平移 · 滚轮缩放</div></main>
<div id="canvas-tools"></div><aside id="inspector" aria-label="编辑面板" hidden></aside><div id="toast" role="status" aria-live="polite"></div><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden multiple><input id="project-file" type="file" accept=".json,application/json" hidden>
<dialog id="confirm"><h2>确认操作</h2><p id="confirm-message"></p><div class="actions"><button data-action="cancel-confirm" autofocus>取消</button><button class="primary" data-action="accept-confirm">继续</button></div></dialog>
<script src="production.js"></script><script src="workflow.js"></script><script src="lifecycle.js"></script><script src="characters.js"></script>
<script src="app.js"></script></body></html>
